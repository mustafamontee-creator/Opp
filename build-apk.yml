name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools platforms;android-36 build-tools;36.0.0" }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - name: Verify the APK is ours (package id, no Play-store gate)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo "APK missing"; exit 1; }
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump badging "$APK" | grep -E "^package:|application-label" 
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.impostorfc.game'" || { echo "Wrong package id"; exit 1; }
          ls -l "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: impostor-fc-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
