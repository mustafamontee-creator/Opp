name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp sw.js www/sw.js
          cp icon-192.png www/icon-192.png
          cp icon-512.png www/icon-512.png
          cp icon.svg www/icon.svg
          cp manifest.webmanifest www/manifest.webmanifest
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: impostor-fc-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
